name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Tag matches the package version
        run: |
          version="$(uv run --locked python -c 'import glue_doctor; print(glue_doctor.__version__)')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the package version ${version}" >&2
            exit 1
          fi
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
